schema_version: 1

system:
  hostname: secbox

network:
  interfaces:
    - name: ens38
      role: mgmt
      ipv4_method: dhcp

    - name: ens33
      role: wan
      ipv4_method: dhcp

    - name: ens36
      role: lan
      ipv4_method: static
      ipv4_address: 192.168.50.1/24

    - name: ens37
      role: unused
      ipv4_method: disabled

dhcp:
  - enabled: true
    interface: ens36
    network: 192.168.50.0/24
    range_start: 192.168.50.100
    range_end: 192.168.50.200
    gateway: 192.168.50.1
    dns_servers:
      - 192.168.1.1
    lease_time: 12h
